<!-- USER MASTER LAYOUT - MODERN LUXURY -->
<div class="user-container">
  <!-- Header: Glassmorphism Effect -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="logo-text">NAMHA</span>
      <span class="logo-sub">HOTEL LUXURY</span>
    </div>

    <ul class="nav-links">
      <li><a routerLink="/user/dashboard" routerLinkActive="active">Trang Chủ</a></li>
      <li><a routerLink="/user/rooms">Hạng Phòng</a></li>
      <li><a routerLink="/user/services">Dịch Vụ</a></li>
      <li><a routerLink="/user/about">Về Chúng Tôi</a></li>
    </ul>

    <div class="nav-actions">
      <button class="btn-my-booking" title="Lịch sử đặt phòng">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </button>
      <!-- Chú thích: Hiển thị tên người dùng nếu đã đăng nhập, ngược lại hiển thị nút Đăng nhập mặc định -->
      <button class="btn-login-user" *ngIf="!currentUser" routerLink="/login">
        <i class="fa-solid fa-user-circle"></i> Đăng Nhập
      </button>

      <div class="user-profile-nav" *ngIf="currentUser">
        <span class="welcome-text">Xin chào, <strong>{{ currentUser.fullName }}</strong></span>
        <button class="btn-logout-small" (click)="onLogout()" title="Đăng xuất">
          <i class="fa-solid fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content: Nơi các trang Dashboard, Room List sẽ hiển thị -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer: Professional Branding -->
  <footer class="footer-user">
    <div class="footer-grid">
      <div class="footer-info">
        <h3>NAMHA HOTEL</h3>
        <p>Trải nghiệm nghỉ dưỡng thượng lưu giữa lòng thành phố.</p>
      </div>
      <div class="footer-contact">
        <p><i class="fa-solid fa-location-dot"></i> 123 Đường Luxury, TP. Đà Lạt</p>
        <p><i class="fa-solid fa-phone"></i> 0123 456 789</p>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 Cinnamon Hotel Group - All Rights Reserved.
    </div>
  </footer>
</div>
